<!doctype html><html lang="es"><meta charset="utf-8"><title>Tercer color · maqueta</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--night:#0a1529;--surface:#0d1c37;--gold:#e0b65c;--sky:#7bc3eb}
*{box-sizing:border-box}body{margin:0;background:#050b17;color:#f4f9ff;font:17px/1.5 Figtree,Arial,sans-serif;padding:24px}
h1.top{font:400 22px Newsreader,Georgia,serif;margin:0 0 16px;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.col{background:var(--night);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:26px;--a:#fff}
.col>h2{margin:0 0 20px;font:600 14px Figtree,sans-serif;color:#9fb4d3}
.pill{display:inline-block;margin:0 0 16px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.05);font-size:15px;font-weight:600;color:var(--a)}
h3.h{font:400 38px/1.1 Newsreader,Georgia,serif;margin:0 0 6px;color:#fff}
h3.h em{display:block;font-style:italic;font-weight:300;color:var(--a)}
p{margin:12px 0 20px;color:#f2f8fe}
.h2{font:400 26px/1.2 Newsreader,Georgia,serif;margin:28px 0 8px;color:#fff}
.h2 .accent{font-style:italic;font-weight:300;color:var(--a)}
.h2::after{content:"";display:block;width:88px;height:3px;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,var(--gold),rgba(224,182,92,.5))}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--sky);color:var(--night);font-weight:700;text-decoration:none;outline:3px solid var(--gold);outline-offset:3px}
.tag{margin-top:22px;font-size:14px;font-weight:600;color:var(--a)}
.stars{color:var(--gold);letter-spacing:2px}
.note{margin-top:20px;font-size:13px;color:#9fb4d3}
</style>
<h1 class="top">Mismo trozo del inicio con tres terceros colores (el dorado queda solo en raya, foco y estrellas)</h1>
<div class="grid">
<script>
[["A. Coral neón (recomendado)","#ff9a8b","8.89:1"],["B. Lavanda crepúsculo","#b9a8ff","8.77:1"],["C. Menta clínica","#6fdcc4","11.03:1"]].forEach(([n,c,r])=>document.write(`
<section class="col" style="--a:${c}"><h2>${n} · ${c} · contraste ${r} sobre noche</h2>
<span class="pill">Las Vegas · Family dentistry</span>
<h3 class="h">Your teeth should<em>last a lifetime.</em></h3>
<p>We create a space that's comfortable and welcoming for all our patients.</p>
<a class="btn" href="#">Request an appointment</a>
<div class="h2">Care that keeps your <span class="accent">natural teeth</span></div>
<div class="tag">General dentistry · <span class="stars">★★★★☆</span></div>
<div class="note">Botón, raya y foco: celeste y dorado sin cambio.</div></section>`));
</script>
</div></html>
